name: Build debug APK
on:
  push:
    branches: [remove-sonnet-row]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure a stable debug keystore exists (so every build shares one signature)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Claude Pulse Debug, OU=Personal, O=Personal, L=, ST=, C=IT"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f debug.keystore
            git commit -m "Add stable debug keystore for reproducible CI signing"
            git push
          fi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: claude-pulse-debug
          path: app/build/outputs/apk/debug/app-debug.apk
